import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.dependency.management)
    alias(libs.plugins.openapi.generator)
}

group = 'by.imsha'
version = '0.0.1-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom(libs.spring.cloud.bom.get().toString())
    }
}

dependencies {
    implementation project(':common')
    implementation project(':meilisearch:reader')

    implementation libs.spring.boot.starter.tomcat
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.webclient
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.data.mongodb
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.security.oauth2.resource.server
    implementation libs.spring.boot.starter.cache
    implementation libs.spring.aspects
    implementation libs.sentry.spring.boot
    implementation libs.cache2k.api
    implementation libs.cache2k.core
    implementation libs.cache2k.spring
    implementation libs.lombok
    implementation libs.mapstruct
    implementation libs.logback.json.classic
    implementation libs.janino
    implementation libs.springdoc.webmvc.ui

    annotationProcessor libs.spring.boot.configuration.processor
    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.lombok
    annotationProcessor libs.lombok.mapstruct.binding

    testImplementation libs.spring.security.test
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.spring.boot.starter.restclient
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.spring.boot.starter
    testImplementation libs.spring.boot.starter.json
    testImplementation libs.testcontainers.junit
    testImplementation libs.wiremock.standalone

    testImplementation libs.lombok
    testAnnotationProcessor libs.lombok
}

sourceSets.main.java.srcDir(layout.buildDirectory.dir('openapi/generated'))

tasks.register('generate passwordless api adapter server', GenerateTask) {
    group = 'generation'
    generatorName.set("spring")
    inputSpec.set(file('openapi/imshaby-api/passwordless-adapter/openapi.yaml'))
    outputDir.set(layout.buildDirectory.dir('openapi/generated'))
    ignoreFileOverride.set(file('.openapi-generator-ignore'))
    configOptions.set([
            library                             : "spring-boot",
            invokerPackage                      : "api_specification.by.imsha.server.passwordless.adapter.server",
            apiPackage                          : "api_specification.by.imsha.server.passwordless.adapter.server.api",
            modelPackage                        : "api_specification.by.imsha.server.passwordless.adapter.server.model",
            configPackage                       : "api_specification.by.imsha.server.passwordless.adapter.server.configuration",
            basePackage                         : "api_specification.by.imsha.server.passwordless.adapter.server",
            useOptional                         : "true",
            openApiNullable                     : "false",
            interfaceOnly                       : "false",
            sourceFolder                        : "",
            testOutput                          : "$rootDir/src/test/java",
            generateApiTests                    : "true",
            generateModelTests                  : "true",
            generateBuilders                    : "true",
            generatedConstructorWithRequiredArgs: "true",
            generateConstructorWithAllArgs      : "true",
            useTags                             : "true",
            useSpringBoot4                      : "true",
            useJackson3                         : "true",
    ])
}

tasks.register('generate auth server', GenerateTask) {
    group = 'generation'
    generatorName.set("spring")
    inputSpec.set(file('openapi/imshaby-api/auth/openapi.yaml'))
    outputDir.set(layout.buildDirectory.dir('openapi/generated'))
    ignoreFileOverride.set(file('.openapi-generator-ignore'))
    configOptions.set([
            library                             : "spring-boot",
            invokerPackage                      : "api_specification.by.imsha.server.auth.server",
            apiPackage                          : "api_specification.by.imsha.server.auth.server.api",
            modelPackage                        : "api_specification.by.imsha.server.auth.server.model",
            configPackage                       : "api_specification.by.imsha.server.auth.server.configuration",
            basePackage                         : "api_specification.by.imsha.server.auth.server",
            useOptional                         : "true",
            openApiNullable                     : "false",
            interfaceOnly                       : "false",
            sourceFolder                        : "",
            testOutput                          : "$rootDir/src/test/java",
            generateApiTests                    : "true",
            generateModelTests                  : "true",
            generateBuilders                    : "true",
            generatedConstructorWithRequiredArgs: "true",
            generateConstructorWithAllArgs      : "true",
            useTags                             : "true",
            useSpringBoot4                      : "true",
            useJackson3                         : "true",
    ])
}

tasks.register('generate inactive parish map v2 server', GenerateTask) {
    group = 'generation'
    generatorName.set('spring')
    inputSpec.set(file('openapi/imshaby-api/feature/parish/inactive/map/v2/openapi.yaml'))
    outputDir.set(layout.buildDirectory.dir('openapi/generated'))
    ignoreFileOverride.set(file('.openapi-generator-ignore'))
    configOptions.set([
            library: 'spring-boot',
            invokerPackage: 'api_specification.by.imsha.server.inactive_parish_map.v2.server',
            apiPackage: 'api_specification.by.imsha.server.inactive_parish_map.v2.server.api',
            modelPackage: 'api_specification.by.imsha.server.inactive_parish_map.v2.server.model',
            configPackage: 'api_specification.by.imsha.server.inactive_parish_map.v2.server.configuration',
            basePackage: 'api_specification.by.imsha.server.inactive_parish_map.v2.server',
            useOptional: 'true', openApiNullable: 'false', interfaceOnly: 'false',
            sourceFolder: '', generateApiTests: 'false', generateModelTests: 'false',
            generateBuilders: 'true', generatedConstructorWithRequiredArgs: 'true',
            generatedConstructorWithAllArgs: 'true', useTags: 'true',
            useSpringBoot4: 'true', useJackson3: 'true'
    ])
}

tasks.register('generate all') {
    group = "generation"
    dependsOn tasks.named('generate passwordless api adapter server'),
            tasks.named('generate auth server'),
            tasks.named('generate inactive parish map v2 server')
}

tasks.named('compileJava') { dependsOn tasks.named('generate all') }
