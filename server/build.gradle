import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.openapi.generator' version '7.25.0'
}

group = 'by.imsha'
version = '0.0.1-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudDependenciesVersion}"
    }
}

dependencies {
    implementation project(':common')
    implementation project(':meilisearch:reader')

    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework:spring-aspects'
    implementation 'io.sentry:sentry-spring-boot-4-starter:8.60.0'
    implementation "org.cache2k:cache2k-api:${cache2kVersion}"
    implementation "org.cache2k:cache2k-core:${cache2kVersion}"
    implementation "org.cache2k:cache2k-spring:${cache2kVersion}"
    implementation 'org.projectlombok:lombok'
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    implementation "ch.qos.logback.contrib:logback-json-classic:${logbackVersion}"
    implementation "org.codehaus.janino:janino:${janinoVersion}"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-json'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"

    testImplementation 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

sourceSets.main.java.srcDir(layout.buildDirectory.dir('openapi/generated'))

tasks.register('generate passwordless api adapter server', GenerateTask) {
    group = 'generation'
    generatorName.set("spring")
    inputSpec.set(file('openapi/imshaby-api/passwordless-adapter/openapi.yaml'))
    outputDir.set(layout.buildDirectory.dir('openapi/generated'))
    ignoreFileOverride.set(file('.openapi-generator-ignore'))
    configOptions.set([
            library                             : "spring-boot",
            invokerPackage                      : "api_specification.by.imsha.server.passwordless.adapter.server",
            apiPackage                          : "api_specification.by.imsha.server.passwordless.adapter.server.api",
            modelPackage                        : "api_specification.by.imsha.server.passwordless.adapter.server.model",
            configPackage                       : "api_specification.by.imsha.server.passwordless.adapter.server.configuration",
            basePackage                         : "api_specification.by.imsha.server.passwordless.adapter.server",
            useOptional                         : "true",
            openApiNullable                     : "false",
            interfaceOnly                       : "false",
            sourceFolder                        : "",
            testOutput                          : "$rootDir/src/test/java",
            generateApiTests                    : "true",
            generateModelTests                  : "true",
            generateBuilders                    : "true",
            generatedConstructorWithRequiredArgs: "true",
            generateConstructorWithAllArgs      : "true",
            useTags                             : "true",
            useSpringBoot4                      : "true",
            useJackson3                         : "true",
    ])
}

tasks.register('generate auth server', GenerateTask) {
    group = 'generation'
    generatorName.set("spring")
    inputSpec.set(file('openapi/imshaby-api/auth/openapi.yaml'))
    outputDir.set(layout.buildDirectory.dir('openapi/generated'))
    ignoreFileOverride.set(file('.openapi-generator-ignore'))
    configOptions.set([
            library                             : "spring-boot",
            invokerPackage                      : "api_specification.by.imsha.server.auth.server",
            apiPackage                          : "api_specification.by.imsha.server.auth.server.api",
            modelPackage                        : "api_specification.by.imsha.server.auth.server.model",
            configPackage                       : "api_specification.by.imsha.server.auth.server.configuration",
            basePackage                         : "api_specification.by.imsha.server.auth.server",
            useOptional                         : "true",
            openApiNullable                     : "false",
            interfaceOnly                       : "false",
            sourceFolder                        : "",
            testOutput                          : "$rootDir/src/test/java",
            generateApiTests                    : "true",
            generateModelTests                  : "true",
            generateBuilders                    : "true",
            generatedConstructorWithRequiredArgs: "true",
            generateConstructorWithAllArgs      : "true",
            useTags                             : "true",
            useSpringBoot4                      : "true",
            useJackson3                         : "true",
    ])
}

tasks.register('generate all') {
    group = "generation"
    dependsOn tasks.named('generate passwordless api adapter server'),
            tasks.named('generate auth server')
}

tasks.named('compileJava') { dependsOn tasks.named('generate all') }
