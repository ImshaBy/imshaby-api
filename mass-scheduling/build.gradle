plugins {
    id 'java-library'
}

dependencies {
    implementation 'org.mnode.ical4j:ical4j:4.4.0'
}

def checkPackageBoundaries = tasks.register('checkPackageBoundaries') {
    dependsOn tasks.named('classes')
    inputs.files(sourceSets.main.output.classesDirs)
    doLast {
        def dependencies = providers.exec {
            def bin = new File(System.getProperty('java.home'), 'bin')
            def windowsExecutable = new File(bin, 'jdeps.exe')
            commandLine windowsExecutable.isFile() ? windowsExecutable : new File(bin, 'jdeps'),
                    '-verbose:class', '-filter:none'
            args sourceSets.main.output.classesDirs.files
        }.standardOutput.asText.get()
        def forbidden = dependencies.readLines().findAll { line ->
            def edge = line.trim().split(/\s+/)
            if (edge.size() < 3 || edge[1] != '->') {
                return false
            }
            def domain = 'by.imsha.mass.scheduling.domain.'
            def application = 'by.imsha.mass.scheduling.application.'
            if (edge[0].startsWith(domain)) {
                def recurrenceLibrary = edge[0] == domain + 'ScheduleRule' &&
                        edge[2] in ['net.fortuna.ical4j.model.Recur', 'net.fortuna.ical4j.model.Recur$Builder',
                                    'net.fortuna.ical4j.model.TemporalAdapter', 'net.fortuna.ical4j.model.WeekDay',
                                    'net.fortuna.ical4j.transform.recurrence.Frequency']
                return !edge[2].startsWith('java.') && !edge[2].startsWith(domain) && !recurrenceLibrary
            }
            edge[0].startsWith(application) && !edge[2].startsWith('java.') &&
                    !edge[2].startsWith(domain) && !edge[2].startsWith(application)
        }
        if (forbidden) {
            throw new GradleException("Forbidden mass scheduling dependencies:\n" + forbidden.join('\n'))
        }
    }
}

tasks.named('check') { dependsOn checkPackageBoundaries }
