[versions]
spring-boot = "4.0.8"
spring-cloud = "2025.1.3"
dependency-management = "1.1.6"
openapi-generator = "7.25.0"
cache2k = "2.6.1.Final"
rest-query-engine = "0.7.1"
lombok-mapstruct-binding = "0.2.0"
mapstruct = "1.6.0"
guava = "33.3.0-jre"
meilisearch-sdk = "0.15.0"
logback = "0.1.5"
janino = "3.1.12"
springdoc = "3.0.3"
wiremock = "3.13.1"
sentry-spring-boot = "8.60.0"
testcontainers = "1.21.4"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-data-mongodb = { module = "org.springframework.data:spring-data-mongodb" }
spring-aspects = { module = "org.springframework:spring-aspects" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-cloud-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-tomcat = { module = "org.springframework.boot:spring-boot-starter-tomcat" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-webclient = { module = "org.springframework.boot:spring-boot-starter-webclient" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
jakarta-validation = { module = "jakarta.validation:jakarta.validation-api" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
commons-lang3 = { module = "org.apache.commons:commons-lang3" }
lombok = { module = "org.projectlombok:lombok" }
slf4j = { module = "org.slf4j:slf4j-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
cache2k-api = { module = "org.cache2k:cache2k-api", version.ref = "cache2k" }
cache2k-core = { module = "org.cache2k:cache2k-core", version.ref = "cache2k" }
cache2k-spring = { module = "org.cache2k:cache2k-spring", version.ref = "cache2k" }
rest-query-engine = { module = "com.github.rutledgepaulv:rest-query-engine", version.ref = "rest-query-engine" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
meilisearch-sdk = { module = "com.meilisearch.sdk:meilisearch-java", version.ref = "meilisearch-sdk" }
logback-json-core = { module = "ch.qos.logback.contrib:logback-json-core", version.ref = "logback" }
logback-json-classic = { module = "ch.qos.logback.contrib:logback-json-classic", version.ref = "logback" }
janino = { module = "org.codehaus.janino:janino", version.ref = "janino" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
sentry-spring-boot = { module = "io.sentry:sentry-spring-boot-4-starter", version.ref = "sentry-spring-boot" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
