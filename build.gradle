subprojects {
    repositories {
        mavenCentral()
    }

    plugins.withId('java') {
        java {
            sourceCompatibility = JavaVersion.VERSION_25
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }
}

configure([project(':common'), project(':server'), project(':mass-index-creator')]) {
    plugins.withId('java') {
        tasks.named('check') { dependsOn ':mass-scheduling:checkPackageBoundaries' }
    }
}
